type UniteEnseignement {
    code: Int!
    domaine: String!
    responsable: String!
    credits: Int!
    semestre: Int!
}

enum TypeModule {
    TRANSVERSAL
    PROFESSIONNEL
    RECHERCHE
}

type Module {
    matricule: String!
    nom: String!
    coefficient: Int!
    volumeHoraire: Int!
    type: TypeModule!
    uniteEnseignement: UniteEnseignement
}

type Query {
    getallmodules: [Module!]!
    getModuleByMatricule(matricule: String!): Module
    getModulesByType(type: TypeModule!): [Module!]!
    getAllUE: [UniteEnseignement!]!
    getUEByCode(code: Int!): UniteEnseignement
    getUEByDomaine(domaine: String!): [UniteEnseignement!]!
    getUEBySemestre(semestre: Int!): [UniteEnseignement!]!
}

type Mutation {
    addUE(code: Int!, domaine: String!, responsable: String!, credits: Int!, semestre: Int!): UniteEnseignement
    updateUE(code: Int!, domaine: String!, responsable: String!, credits: Int!, semestre: Int!): UniteEnseignement
    deleteUE(code: Int!): Boolean!

    addModule(matricule: String!, nom: String!, coefficient: Int!, volumeHoraire: Int!, type: TypeModule!, codeUE: Int): Module
    updateModule(matricule: String!, nom: String!, coefficient: Int!, volumeHoraire: Int!, type: TypeModule!, codeUE: Int): Module
    deleteModule(matricule: String!): Boolean!
}

schema {
    query: Query
    mutation: Mutation
}